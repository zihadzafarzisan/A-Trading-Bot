strategies:
  trend_following:
    type: trend
    name: "Trend Following"
    description: "Follows market trends using moving averages"
    parameters:
      ema_fast: [10, 20, 30]
      ema_slow: [50, 100, 200]
      adx_threshold: [25, 30, 35]
      atr_multiplier: [1.0, 1.5, 2.0, 2.5]
      risk_reward_ratio: [1.5, 2.0, 2.5, 3.0]
    filters:
      min_volume: 1000000
      min_adx: 25

  momentum:
    type: momentum
    name: "Momentum"
    description: "Buys strong momentum, sells weak"
    parameters:
      rsi_period: [14, 21]
      rsi_oversold: [30, 35, 40]
      rsi_overbought: [60, 65, 70]
      macd_fast: [12]
      macd_slow: [26]
      macd_signal: [9]
      roc_period: [10, 20]
    filters:
      min_volume: 500000

  mean_reversion:
    type: mean_reversion
    name: "Mean Reversion"
    description: "Trades mean reversion using Bollinger Bands"
    parameters:
      bb_period: [20, 25, 30]
      bb_std: [2.0, 2.5, 3.0]
      rsi_period: [14]
      rsi_extreme: [25, 30, 35]
      lookback: [20, 50]
    filters:
      min_volume: 500000

  breakout:
    type: breakout
    name: "Breakout"
    description: "Trades breakouts from consolidation"
    parameters:
      atr_period: [14, 20]
      atr_multiplier: [1.5, 2.0, 2.5]
      lookback: [20, 30, 50]
      volume_confirmation: [1.5, 2.0]
      confirmation_bars: [1, 2]
    filters:
      min_volume: 1000000

  combined:
    type: combined
    name: "Multi-Indicator"
    description: "Combines multiple indicators"
    parameters:
      ema_fast: [10, 20]
      ema_slow: [50, 100]
      rsi_period: [14]
      rsi_filter: [45, 50, 55]
      volume_ratio: [1.0, 1.2, 1.5]
      atr_multiplier: [1.5, 2.0]
    filters:
      min_volume: 500000

universes:
  top_10: 10
  top_20: 20
  top_30: 30
  custom: []
  btc_only: ["BTC"]
  eth_only: ["ETH"]

market_regimes:
  bull:
    conditions:
      - sma_50_above_sma_200: true
      - adx_above: 25
      - price_above_sma_50: true
  bear:
    conditions:
      - sma_50_below_sma_200: true
      - adx_above: 25
      - price_below_sma_50: true
  sideways:
    conditions:
      - sma_50_close_to_sma_200: true
      - adx_below: 25
  high_volatility:
    conditions:
      - atr_percentile_above: 75
  low_volatility:
    conditions:
      - atr_percentile_below: 25

execution:
  modes:
    signal_only:
      description: "Only generate signals, no execution"
    paper:
      description: "Simulate trades with live prices"
    live:
      description: "Execute real trades"
      requires:
        - api_key
        - api_secret
        - dry_run_explicitly_set_false
