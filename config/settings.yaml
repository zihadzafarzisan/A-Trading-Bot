market:
  exchange: binance
  spot: true
  futures: true
  default_market: spot

data:
  start_date: "2020-01-01"
  end_date: "2026-09-08"
  base_url: "https://api.binance.com"
  rate_limit:
    requests_per_second: 10
    requests_per_minute: 1200
  retry:
    max_attempts: 5
    backoff_factor: 2.0

universe:
  mode: historical_top_n
  top_n: 20
  fallback: manual_list

timeframes:
  primary: ["1h", "4h", "1d"]
  available: ["1m", "5m", "15m", "30m", "1h", "4h", "1d"]

research:
  start_date: "2020-01-01"
  end_date: "2026-09-08"
  train_end: "2024-12-31"
  validation_end: "2025-12-31"
  test_start: "2026-01-01"

risk:
  starting_capital: 1000.0
  risk_per_trade: 0.01
  max_open_positions: 3
  max_leverage: 5
  max_position_pct: 0.5
  daily_loss_limit: 100.0
  weekly_loss_limit: 500.0
  max_drawdown_pct: 0.25

trading:
  mode: paper  # signal_only, paper, live
  dry_run: true

fees:
  spot:
    maker: 0.001
    taker: 0.001
  futures:
    maker: 0.0002
    taker: 0.0004
  slippage: 0.0005
  funding_rate: 0.0001

backtesting:
  initial_capital: 1000.0
  commission: 0.001
  slippage: 0.0005
  execution_delay_bars: 1

optimization:
  search_type: grid  # grid, random, bayesian
  max_combinations: 1000
  objective: max_win_rate
  min_trades: 100

ml:
  models:
    - logistic_regression
    - random_forest
    - xgboost
  test_size: 0.2
  validation_size: 0.15
  features:
    - rsi
    - ema_distance
    - atr_ratio
    - volume_ratio
    - volatility
    - momentum
    - market_regime
    - hour
    - day_of_week
    - timeframe

dashboard:
  output_dir: "./dashboard"
  auto_open: false
  theme: dark

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    - console
    - file
  file_handlers:
    application: "logs/application.log"
    data: "logs/data.log"
    research: "logs/research.log"
    backtest: "logs/backtest.log"
    trading: "logs/trading.log"
    risk: "logs/risk.log"
    error: "logs/error.log"
